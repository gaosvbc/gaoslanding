<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Página no encontrada | GAO'S</title>
    <meta name="description" content="La página que buscas no existe. Vuelve al inicio o entra en reformas, studio o contacto." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #f3f4f6;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 2rem 1.5rem 3rem;
      }
      header a {
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
      }
      main { max-width: 48rem; margin: auto; width: 100%; }
      .eyebrow {
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a3a3a3;
        margin: 0 0 1.5rem;
      }
      h1 {
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 7vw, 4rem);
        line-height: 1.05;
        font-weight: 400;
        margin: 0 0 1.5rem;
      }
      h1 em { color: #a3a3a3; }
      p.lead { color: #d4d4d4; line-height: 1.7; max-width: 34rem; margin: 0 0 2.5rem; }
      ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid #262626; }
      li { border-bottom: 1px solid #262626; }
      li a {
        display: flex;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 1.25rem 0;
        color: #fff;
        text-decoration: none;
      }
      li a:hover { color: #a3a3a3; }
      li span.desc { color: #737373; font-size: 0.85rem; text-align: right; }
      footer {
        margin-top: 3rem;
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #525252;
        text-align: center;
      }
      footer a { color: #737373; }
    </style>
  </head>
  <body>
    <header><a href="/">Gaos</a></header>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Esta página <em>no existe</em>.</h1>
      <p class="lead">
        El enlace que has seguido está roto o la dirección se escribió mal. Estas sí
        funcionan:
      </p>
      <ul>
        <li>
          <a href="/reformas"><span>Gaos Reformas</span><span class="desc">Reforma integral en Madrid</span></a>
        </li>
        <li>
          <a href="/studio"><span>Gaos Studio</span><span class="desc">Diseño de interiores en Madrid</span></a>
        </li>
        <li>
          <a href="/contacto"><span>Contacto</span><span class="desc">Presupuesto sin compromiso</span></a>
        </li>
        <li>
          <a href="/"><span>Inicio</span><span class="desc">GAO'S</span></a>
        </li>
      </ul>
      <footer>
        <a href="mailto:hola@gaos.es">hola@gaos.es</a>
      </footer>

</html>
